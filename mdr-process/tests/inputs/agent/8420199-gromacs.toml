description = "Human GET insertase complex hsGet2ΔN-Get1/Get3 (WRB/CAML/TRC40) modelled from cryo-EM structure PDB 6SO5, embedded in a 1:4 cholesterol:POPC bilayer at 310 K; PDB entry 6SO5\nHuman GET insertase complex hsGet2ΔN-Get1/Get3 (WRB/CAML/TRC40) modelled from the cryo-EM structure PDB 6SO5, embedded in a 1:4 cholesterol:POPC bilayer (65 cholesterol, 260 POPC) with 150 mM KCl at 310 K. Missing residues (except terminal ones) were modelled with Modeller using the more complete chain where possible without enforcing symmetry, the disulphide bridges seen in the cryo-EM structure were included (two between the hsGet3 dimers, one between each hsGet1/hsGet2 pair, one in each hsGet2), and the model was refined in real space with Phenix. The system was built with CHARMM-GUI; lipid and water numbers were adjusted to give a hexagonal prism box with a base edge of ~110 Å and a height of ~170 Å, periodic in all three dimensions, solvated with TIP3P water and 150 mM KCl and neutralised with additional counter ions. Interactions were described with the CHARMM36(m) force field for the lipids and protein and a compatible ion parameter set; WYF parameters were used for improved cation-π interactions and Hydrogen Mass Repartitioning allowed a 4 fs integration time step. The system was equilibrated following the CHARMM-GUI protocol before production. Production was run with GROMACS 2020 in the NpT ensemble with the Nosé-Hoover thermostat at 310 K (protein, membrane and solvent coupled to separate baths, time constant 1.0 ps) and semi-isotropic Parrinello-Rahman pressure coupling at 1 atm (time constant 5 ps, compressibility 4.5e-5 bar^-1), integrating the equations of motion with a leap-frog algorithm and a 4 fs time step. All bond lengths were constrained with LINCS, Coulomb interactions used a 1.2 nm real-space cut-off with smooth particle-mesh Ewald (0.12 nm Fourier spacing, fourth-order interpolation), and Lennard-Jones interactions were force-switched between 1.0 and 1.2 nm. Three independent repeats of 3 µs each were run, with coordinates saved every 100 ps during production and the released trajectories subsampled to 1 ns. See the linked manuscript for procedural details. Between them the 3 replicates hold 9003 frames of a 59412-atom system, 3001 per replicate, saved every 1 ns, 9 μs of sampling.\n\n[This entry was extracted from Zenodo record 8420199, and the description and metadata were automatically generated by Claude. If you see errors in the results of this extraction, please let us know. The data set was not released with a topology file, so our automated process generated a .psf topology from the deposited .pdb with ParmEd (parmed.load_file('6-chol_PC.pdb').save('6-chol_PC.psf', format='psf')), preserving the identical atom set and order. The simulations were run with GROMACS 2020. MDRepo takes only certain file formats for each engine, and the deposited structure (.pdb), topology (.psf) and trajectories are not the set it takes for that one, so the software is declared as CUSTOM.]"
forcefield = "CHARMM36m"
forcefield_comments = "CHARMM36(m) force field for the lipids and the protein with a compatible parameter set for the ions; parameter and topology set generated by CHARMM-GUI. WYF parameters were used for improved cation-π interactions, and the Hydrogen Mass Repartitioning (HMR) method was applied to increase the integration time step to 4 fs."
pdb_id = "6SO5"
dois = ["10.5281/zenodo.8420199", "10.1038/s41467-023-42867-2"]
