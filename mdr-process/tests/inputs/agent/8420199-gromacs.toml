short_description = "Human GET insertase complex hsGet2ΔN-Get1/Get3 (WRB/CAML/TRC40) modelled from cryo-EM structure PDB 6SO5, embedded in a 1:4 cholesterol:POPC bilayer at 310 K; PDB entry 6SO5"
