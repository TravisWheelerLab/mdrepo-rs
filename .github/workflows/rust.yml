name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Check formatting
      run: cargo fmt --all --check
    - name: Install BLAST
      # Tests that run blastp skip themselves without it
      run: |
        sudo apt-get update
        sudo apt-get install -y ncbi-blast+
        blastp -version
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
