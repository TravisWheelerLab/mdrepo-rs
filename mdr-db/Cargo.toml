[package]
name = "mdr-db"
version = "0.1.0"
edition = "2024"

[dependencies]
# 64-column-tables: md_simulation has 33 columns and diesel's table! macro
# stops expanding past 32 by default. It fails as ~280 errors of the form
# "use of unresolved module md_simulation", only the first of which mentions
# the column count -- so it reads like the schema vanished, not like a limit.
# Needed on the dev-dependency below as well, or the tests fail the same way.
diesel = { version = "2.2", features = ["postgres", "chrono", "uuid", "serde_json", "64-column-tables"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
utoipa = { version = "6", features = ["chrono", "uuid"] }

[dev-dependencies]
diesel = { version = "2.2", features = ["postgres", "64-column-tables"] }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
